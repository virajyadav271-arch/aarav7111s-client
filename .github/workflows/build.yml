name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q aarav7111s-client-source.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14" }
      - run: gradle build
        working-directory: aarav7111s-client
      - uses: actions/upload-artifact@v4
        with:
          name: aarav7111s-client-jar
          path: aarav7111s-client/build/libs/*.jar
